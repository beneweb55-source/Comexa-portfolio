<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Comexa">
  <!--
    Favicon Comexa — le SINGE du logo (les deux dalles paralleles), sans le
    texte « Comexa / PLUS LOIN ENSEMBLE » : a 16 px, une ligne de texte serait
    illisible, alors que la marque graphique reste reconnaissable.
    Meme degrade que le logo horizontal (bleu marine vers bleu ciel).
  -->
  <defs>
    <linearGradient id="comexa-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2f5c" />
      <stop offset="1" stop-color="#2b8fd9" />
    </linearGradient>
    <linearGradient id="comexa-bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa5e8" />
      <stop offset="1" stop-color="#b5dcf7" />
    </linearGradient>
  </defs>
  <!-- Dalle haute : penchee vers la gauche, coins arrondis. -->
  <rect x="26" y="10" width="84" height="44" rx="11" fill="url(#comexa-top)" transform="skewX(-16)" />
  <!-- Dalle basse : meme inclinaison, decalee vers le bas et la droite. -->
  <rect x="40" y="64" width="84" height="44" rx="11" fill="url(#comexa-bottom)" transform="skewX(-16)" />
</svg>
