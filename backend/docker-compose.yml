# =============================================================================
# Comexa — environnement complet du backend, en local ou auto-heberge
# =============================================================================
#
#     cd backend
#     docker compose up --build          # base + stockage + migrations + API
#     docker compose --profile seed run --rm seed
#
#     # Passerelle WhatsApp (voir le service `waha` plus bas, et l'AVERTISSEMENT
#     # qui l'accompagne : un compte personnel connecte ici peut etre banni) :
#     COMEXA_WHATSAPP_DRIVER=waha docker compose --profile gateway up --build
#
# Ce fichier monte QUATRE services et trois executions ou services optionnels :
#
#     db         PostgreSQL 17             la base
#     minio      stockage S3-compatible    les fichiers (jamais en base)
#     minio-init cree le bucket            s'execute une fois, puis s'arrete
#     migrate    `prisma migrate deploy`   s'execute une fois, puis s'arrete
#     api        l'API NestJS              http://localhost:3001/api
#     seed       (profil `seed`)           jeu de donnees de demonstration
#     waha       (profil `gateway`)        passerelle WhatsApp, une instance pour
#                                          toutes les sessions
#
# -----------------------------------------------------------------------------
# POURQUOI CE FICHIER IGNORE `backend/.env`
# -----------------------------------------------------------------------------
# Docker Compose lit automatiquement le `.env` situe a cote de ce fichier pour
# interpoler les `${VARIABLES}`. Or ce `.env` contient la vraie chaine de
# connexion de l'utilisateur, qui pointe sur une base Neon DISTANTE.
#
# Ecrire `${DATABASE_URL:-postgresql://...@db:5432/...}` ferait donc exactement
# le contraire de ce que la ligne laisse croire : la valeur par defaut ne
# servirait jamais, et `docker compose up` lancerait une base locale que
# personne n'interroge pendant que l'API ecrirait dans la base distante. Le
# premier symptome serait des migrations appliquees au mauvais endroit.
#
# D'ou des noms de variables PROPRES A CE FICHIER (`COMEXA_*`). Ils ne peuvent
# pas etre renseignes par accident, et pour viser une base distante il faut le
# dire explicitement :
#
#     COMEXA_DATABASE_URL='postgresql://...neon.tech/neondb?sslmode=require' \
#     COMEXA_DIRECT_URL='postgresql://...neon.tech/neondb?sslmode=require' \
#       docker compose up --build api
#
# Dans ce cas, les services `db`, `minio` et `minio-init` ne servent plus a
# rien : ne pas les demarrer est la bonne facon de faire.
#
# -----------------------------------------------------------------------------
# POURQUOI POSTGRESQL LOCAL ET PAS DIRECTEMENT LA BASE NEON
# -----------------------------------------------------------------------------
# La production vise Neon. Mais developper contre une base distante partagee
# signifie que le premier `prisma migrate reset` de bonne foi efface les donnees
# de quelqu'un d'autre. Une base locale jetable est la seule facon de pouvoir
# casser, recommencer et seeder sans consequence.
# =============================================================================

name: comexa-backend

services:
  # --- Base de donnees --------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comexa
      POSTGRES_PASSWORD: comexa
      POSTGRES_DB: comexa
      # Les tris et comparaisons de `pg_dump`/`pg_restore` en dependent : sans
      # locale figee, une sauvegarde restauree sur une autre machine ne retrie
      # pas les accents de la meme facon.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Expose uniquement pour `psql` et `prisma studio` depuis l'hote.
      - '5432:5432'
    volumes:
      - comexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` ne dit pas seulement que le port repond : il dit que le
      # serveur accepte des connexions. C'est la difference entre « le conteneur
      # a demarre » et « la base est prete », et c'est ce qui evite que `migrate`
      # parte trop tot et echoue au premier lancement.
      test: ['CMD-SHELL', 'pg_isready -U comexa -d comexa']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Stockage des fichiers --------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: comexa
      MINIO_ROOT_PASSWORD: comexa-dev-secret
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # console web
    volumes:
      - comexa_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Cree le bucket puis s'arrete. Separe du serveur parce que MinIO ne sait pas
  # provisionner un bucket au demarrage : sans cette etape, le premier envoi de
  # fichier echoue sur un bucket inexistant, ce qui ressemble a une erreur de
  # configuration du backend alors que ce n'en est pas une.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set comexa http://minio:9000 comexa comexa-dev-secret &&
      mc mb --ignore-existing comexa/${COMEXA_S3_BUCKET:-comexa-documents} &&
      mc anonymous set none comexa/${COMEXA_S3_BUCKET:-comexa-documents} &&
      echo 'Bucket ${COMEXA_S3_BUCKET:-comexa-documents} pret.'
      "
    restart: 'no'

  # --- Migrations -------------------------------------------------------------
  # Construit depuis l'etape `build` : il lui faut la CLI Prisma ET le client
  # genere, absents de l'image d'execution. C'est ce qui permet de garder cette
  # derniere legere et sans chaine d'outils de compilation.
  migrate:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${COMEXA_DATABASE_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}
      DIRECT_URL: ${COMEXA_DIRECT_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  # --- API --------------------------------------------------------------------
  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3001'
      API_PREFIX: api
      # Le frontend Next tourne sur l'hote (`npm run dev`) : depuis le
      # conteneur, `localhost` designe le conteneur lui-meme, pas la machine.
      CORS_ORIGIN: ${COMEXA_CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${COMEXA_FRONTEND_URL:-http://localhost:3000}

      DATABASE_URL: ${COMEXA_DATABASE_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}
      DIRECT_URL: ${COMEXA_DIRECT_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}

      # Les fichiers vont dans le stockage objet, JAMAIS dans PostgreSQL :
      # `Document` ne conserve qu'une cle et des metadonnees.
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${COMEXA_S3_BUCKET:-comexa-documents}
      S3_ACCESS_KEY_ID: comexa
      S3_SECRET_ACCESS_KEY: comexa-dev-secret
      # Indispensable face a MinIO : sans adressage par chemin, le client
      # cherche un sous-domaine `<bucket>.minio` qui ne resout pas.
      S3_FORCE_PATH_STYLE: 'true'
      MAX_UPLOAD_BYTES: '26214400'

      # Secrets de demonstration, valables UNIQUEMENT pour cette pile locale. Le
      # serveur refuse de demarrer en production avec ces valeurs : voir
      # env.validation.ts.
      JWT_ACCESS_SECRET: ${COMEXA_JWT_ACCESS_SECRET:-dev-access-secret-a-remplacer-en-production-48-octets-minimum}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ${COMEXA_JWT_REFRESH_SECRET:-dev-refresh-secret-a-remplacer-en-production-48-octets-minimum}
      JWT_REFRESH_TTL: 30d
      PASSWORD_RESET_TTL: 1h

      # En local, le lien de reinitialisation est ecrit dans les journaux plutot
      # qu'envoye : il n'y a pas de serveur SMTP. Le serveur refuse de demarrer
      # en production si ni le couple `MAILJET_API_KEY` + `MAILJET_SECRET_KEY` ni
      # `SMTP_HOST` n'est renseigne, mais cette pile-ci n'est pas la production.
      SMTP_HOST: ''

      # --- Passerelle WhatsApp ------------------------------------------------
      # `none` PAR DEFAUT, et c'est le point important : sans
      # `COMEXA_WHATSAPP_DRIVER=waha`, l'API ne tente aucun appel et les routes
      # WhatsApp repondent 503 avec un code stable. Rien ne change pour une pile
      # qui ne veut pas de cette fonctionnalite.
      #
      # L'URL pointe vers le service `waha` de CE fichier, qui ne tourne que sous
      # le profil `gateway`. Renseigner le pilote sans demarrer le profil donne
      # des 503 `WHATSAPP_GATEWAY_UNREACHABLE` — un message qui nomme la variable
      # a verifier, donc une panne qui se diagnostique.
      WHATSAPP_GATEWAY_DRIVER: ${COMEXA_WHATSAPP_DRIVER:-none}
      WHATSAPP_GATEWAY_URL: ${COMEXA_WHATSAPP_URL:-http://waha:3000}
      # La MEME cle des deux cotes : celle-ci est celle que l'API presente, et le
      # service `waha` la verifie. Une cle differente donne des 401 partout, qui
      # ressemblent a s'y meprendre a une passerelle cassee.
      WHATSAPP_GATEWAY_API_KEY: ${COMEXA_WHATSAPP_API_KEY:-comexa-waha-dev-key}
      WHATSAPP_SESSION_PREFIX: ${COMEXA_WHATSAPP_SESSION_PREFIX:-comexa}
      WHATSAPP_MAX_MESSAGES_PER_HOUR: ${COMEXA_WHATSAPP_MAX_PER_HOUR:-40}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${COMEXA_WHATSAPP_COUNTRY:-DZ}

      # --- Transcription des vocaux Telegram ----------------------------------
      # `none` par defaut : la route repond 503 `TRANSCRIPTION_NOT_CONFIGURED`
      # avec la marche a suivre. La cle n'est PAS mise ici par defaut — une cle de
      # fournisseur dans un fichier de composition est une cle dans le depot.
      TRANSCRIPTION_PROVIDER: ${COMEXA_TRANSCRIPTION_PROVIDER:-none}
      TRANSCRIPTION_BASE_URL: ${COMEXA_TRANSCRIPTION_BASE_URL:-https://api.groq.com/openai/v1}
      TRANSCRIPTION_API_KEY: ${COMEXA_TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_MODEL: ${COMEXA_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      TELEGRAM_BOT_USERNAME: ${COMEXA_TELEGRAM_BOT_USERNAME:-ComexaWork_bot}
    ports:
      - '3001:3001'
    extra_hosts:
      # Necessaire sous Linux, ou `host.docker.internal` n'existe pas d'office.
      # Inutile sous Docker Desktop, ou ce n'est qu'une entree de plus.
      - 'host.docker.internal:host-gateway'

  # --- Jeu de donnees de demonstration ----------------------------------------
  # Sous profil : `docker compose --profile seed run --rm seed`. Le rendre
  # automatique serait une erreur — le seed ecrit des comptes de demonstration
  # avec des mots de passe connus, et rien ne doit pouvoir le declencher par
  # surprise sur un environnement ou quelqu'un a commence a travailler.
  seed:
    profiles: ['seed']
    build:
      context: .
      target: build
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ${COMEXA_DATABASE_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}
      DIRECT_URL: ${COMEXA_DIRECT_URL:-postgresql://comexa:comexa@db:5432/comexa?schema=public}
    command: ['npm', 'run', 'db:seed']
    restart: 'no'

  # --- Passerelle WhatsApp (WAHA) ---------------------------------------------
  # SOUS PROFIL, ET CE N'EST PAS UNE PRECAUTION DE STYLE.
  #
  #     COMEXA_WHATSAPP_DRIVER=waha docker compose --profile gateway up --build
  #
  # Demarrer ce service sans le vouloir ferait tourner un automate capable de
  # parler au nom d'un numero reel. Deux consequences a connaitre avant :
  #
  #   1. CONNECTER UN COMPTE PERSONNEL A UN AUTOMATE EST CONTRAIRE AUX CONDITIONS
  #      D'UTILISATION DE WHATSAPP et peut entrainer la suspension DEFINITIVE du
  #      numero. Le pilote employe ici (`waha`, WAHA Core) tient une session
  #      multidevice exactement comme WhatsApp Web le fait.
  #   2. AUCUNE API OFFICIELLE ne donne acces a un compte personnel et a son
  #      repertoire. Ce service est donc le seul chemin vers ce que demande le
  #      besoin — et le seul a porter ce risque. Les garde-fous sont cote API :
  #      consentement versionne et revoquable, plafond horaire, groupes interdits,
  #      journal de chaque envoi.
  #
  # Un SEUL conteneur pour toutes les sessions : WAHA gere plusieurs sessions dans
  # une instance, ce qui est la forme du besoin (un membre, ou un tiers deleguant,
  # = une session). Evolution API, l'autre pilote pris en charge par le code,
  # demanderait un conteneur par numero.
  #
  # Le PORT N'EST PAS PUBLIE : la passerelle ne doit etre joignable que depuis le
  # reseau interne de cette pile. L'exposer sur l'hote mettrait a disposition une
  # API capable d'envoyer des messages depuis un numero reel, protegee par une
  # seule cle — et cette cle est, par defaut ici, une valeur de demonstration.
  waha:
    profiles: ['gateway']
    image: devlikeapro/waha:core
    restart: unless-stopped
    environment:
      # Cle verifiee par WAHA sur chaque requete (en-tete `X-Api-Key`). A
      # REMPLACER hors de cette pile locale : la valeur par defaut est publique,
      # puisqu'elle est dans le depot.
      WHATSAPP_API_KEY: ${COMEXA_WHATSAPP_API_KEY:-comexa-waha-dev-key}
      # Un seul navigateur sans interface graphique tient toutes les sessions.
      WHATSAPP_BROWSER_LIMIT: ${COMEXA_WHATSAPP_BROWSER_LIMIT:-5}
      # Redemarrage automatique des sessions apres un arret du conteneur : sans
      # lui, chaque `docker compose up` exigerait de rescanner un QR par compte.
      WHATSAPP_RESTART_ALL_SESSIONS: 'true'
      # Les sessions (identifiants d'appairage) vivent dans le volume `comexa_waha`.
      # PERDRE CE VOLUME, C'EST RESCANNER UN QR SUR CHAQUE TELEPHONE : c'est la
      # seule donnee irremplacable de ce service.
      WAHA_CORE_SESSIONS_PATH: /app/.sessions
      # Journal minimal : les journaux de WAHA peuvent contenir des numeros. Les
      # garder au niveau `info` borne ce qui est ecrit sur le disque de l'hote.
      WAHA_LOG_LEVEL: ${COMEXA_WHATSAPP_LOG_LEVEL:-info}
    volumes:
      - comexa_waha:/app/.sessions
    healthcheck:
      # `/api/sessions` ne rend aucun secret et repond des que l'API interne est
      # prete : sans sonde, `depends_on` ne dirait rien d'utile et l'API
      # demarrerait avant la passerelle.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/sessions >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  comexa_pgdata:
    name: comexa_pgdata
  comexa_minio:
    name: comexa_minio
  comexa_waha:
    name: comexa_waha
